[workspace]
name = "cloudcompare"
version = "2.14.0"
description = "CloudCompare is a 3D point cloud processing software."
authors = ["Daniel Girardeau-Montaut <admin@cloudcompare.org>"]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tasks.CloudCompare]
# Start the built executable
cmd = ".build/install/CloudCompare/CloudCompare.app/Contents/MacOS/CloudCompare"
#input = ".build/install/CloudCompare/CloudCompare.app/Contents/MacOS/CloudCompare"
depends-on = ["install"]

[feature.build.dependencies]
cmake = ">=4.1.1,<4.2"
cxx-compiler = ">=1.9.0,<1.10"
ninja = "1.13.*"

[dependencies]
qt6-main= ">=6.9.1,<6.12.0" # at least 6.9.1 for PCL 1.15.1
laszip = ">=3.4.3,<3.5"
opencv = ">=4.13.0,<4.14"
pcl = ">=1.15.1,<1.16"
python = ">3.12,<3.13"
libboost = ">=1.88.0,<1.89"
pybind11 = ">=3.0,<3.1"
pyside6 = ">=6.8.1"
eigen = ">=3.4.0,<3.5"
draco = ">=1.5.7,<1.6"
xerces-c = ">=3.3.0,<3.4"
occt = ">=7.9,<8.0" # Opencascade
tbb = ">=2022.2.0,<2023"
cgal-cpp = ">=6.1,<7"
libgdal-core = ">=3.12.0,<4"
llvm-openmp = ">=19.0,<22.0"

[feature.build.tasks.configure]
# Configures CMake
cmd = [
	"cmake",
	"-GNinja",
	"-S.",
	# We want build in the .build directory
	"-B.build",
	"-DCMAKE_OSX_DEPLOYMENT_TARGET=13.0",
	"-DCMAKE_C_FLAGS=-I$CONDA_PREFIX/include",       # for llvm-openmp detection
	"-DCMAKE_CXX_FLAGS=-I$CONDA_PREFIX/include",     # for llvm-openmp detection
	"-DCMAKE_BUILD_TYPE=Release",
	"-DCMAKE_INSTALL_PREFIX=.build/install",
	"-DBUILD_SHARED_LIBS=OFF",
	"-DCCCORELIB_USE_CGAL=ON",
	"-DCCCORELIB_USE_TBB=ON",
	"-DCC_USE_EIGEN=ON",
	"-DCMAKE_BUILD_TYPE=Release",
	"-DCMAKE_CXX_FLAGS=-I$CONDA_PREFIX/include",     # for llvm-openmp detection
	"-DCMAKE_CXX_FLAGS=-mmacosx-version-min=13.0",
	"-DCMAKE_C_FLAGS=-I$CONDA_PREFIX/include",       # for llvm-openmp detection
	"-DCMAKE_C_FLAGS=-mmacosx-version-min=13.0",
	"-DCMAKE_INSTALL_PREFIX=.build/install",
	"-DCMAKE_LD_FLAGS=-mmacosx-version-min=13.0",
	"-DCMAKE_PREFIX_PATH=$CONDA_PREFIX/lib",
	"-DCORK_INCLUDE_DIR:PATH=$HOME/projets/CloudComPy/Cork/cork/src",
	"-DCORK_RELEASE_LIBRARY_FILE:FILEPATH=$HOME/projets/CloudComPy/Cork/cork/lib/libcork.a",
	"-DDRACO_INCLUDE_DIR=$CONDA_PREFIX/include",
	"-DDRACO_LIBRARIES=$CONDA_PREFIX/lib/libdraco.a",
	"-DDRACO_LIB_DIR=$CONDA_PREFIX/lib",
	"-DE57_RELEASE_LTO=OFF", 				#TODO: Needed else it won't find the AR/Ranlib binary
	"-DEIGEN_ROOT_DIR=$CONDA_PREFIX/include/eigen3",
	"-DFBX_SDK_INCLUDE_DIR:PATH=/Applications/Autodesk/FBX SDK/2020.2.1/include",
	"-DFBX_SDK_LIBRARY_DIR:PATH=/Applications/Autodesk/FBX SDK/2020.2.1/lib/clang/release",
	"-DFBX_SDK_LIBRARY_FILE:FILEPATH=/Applications/Autodesk/FBX SDK/2020.2.1/lib/clang/release/libfbxsdk.dylib",
	"-DLIBIGL_INCLUDE_DIR:PATH=$HOME/projets/CloudComPy/libigl/libigl/include",
	"-DLIBIGL_RELEASE_LIBRARY_FILE:FILEPATH=$HOME/projets/CloudComPy/libigl/install/lib/libigl.a",
	"-DMPIR_INCLUDE_DIR=$CONDA_PREFIX/include",
	"-DMPIR_RELEASE_LIBRARY_FILE=$CONDA_PREFIX/lib/libgmp.dylib",
	"-DOPENCASCADE_78_OR_NEWER=ON",
	"-DOPENCASCADE_INC_DIR=$CONDA_PREFIX/include/opencascade",
	"-DOPENCASCADE_LIB_DIR=$CONDA_PREFIX/lib",
	"-DOPTION_USE_GDAL=ON",
	"-DPLUGIN_GL_QEDL=ON",
	"-DPLUGIN_GL_QSSAO=ON"
	"-DPLUGIN_IO_QADDITIONAL=ON",
	"-DPLUGIN_IO_QCORE=ON",
	"-DPLUGIN_IO_QCSV_MATRIX=ON",
	"-DPLUGIN_IO_QDRACO=ON", #TODO
	"-DPLUGIN_IO_QE57=ON",
	"-DPLUGIN_IO_QFBX=ON", 					# Possible, but it needs a proprietary SDK
	"-DOPTION_SUPPORT_3DCONNEXION_DEVICES=ON",
	"-DOPTION_HID_DEBUG=ON",
	"-DPLUGIN_IO_QLAS=ON",
	"-DPLUGIN_IO_QPHOTOSCAN=ON",
	"-DPLUGIN_IO_QRDB=OFF", 				# Needs a proprietary lib. The lib is not available for osx-arm64
	"-DPLUGIN_IO_QSTEP=ON",
	"-DPLUGIN_PYTHON=ON",
	"-DPLUGIN_STANDARD_3DMASC=ON",
	"-DPLUGIN_STANDARD_MASONRY_QAUTO_SEG=ON",
	"-DPLUGIN_STANDARD_MASONRY_QMANUAL_SEG=ON",
	"-DPLUGIN_STANDARD_QANIMATION=ON",
	"-DPLUGIN_STANDARD_QBROOM=ON",
	"-DPLUGIN_STANDARD_QCORK=ON",
	"-DCORK_INCLUDE_DIR:PATH=$HOME/projets/CloudComPy/Cork/cork/src",
	"-DCORK_RELEASE_LIBRARY_FILE:FILEPATH=$HOME/projets/CloudComPy/Cork/cork/lib/libcork.a",
	"-DMPIR_INCLUDE_DIR=$CONDA_PREFIX/include",
	"-DMPIR_RELEASE_LIBRARY_FILE=$CONDA_PREFIX/lib/libgmp.dylib",
	"-DPLUGIN_STANDARD_QCSF=ON",
	"-DPLUGIN_STANDARD_QCANUPO=ON",
	"-DPLUGIN_STANDARD_QCLOUDLAYERS=ON",
	"-DPLUGIN_STANDARD_QCOLORIMETRIC_SEGMENTER=ON",
	"-DPLUGIN_STANDARD_QCOMPASS=ON",
	"-DPLUGIN_STANDARD_QCORK=ON",
	"-DPLUGIN_STANDARD_QCSF=ON",
	"-DPLUGIN_STANDARD_QFACETS=ON",
	"-DPLUGIN_STANDARD_QHOUGH_NORMALS=ON",
	"-DPLUGIN_STANDARD_QJSONRPC=ON",
	"-DPLUGIN_STANDARD_QM3C2=ON",
	"-DPLUGIN_STANDARD_QMESH_BOOLEAN=ON", 	#TODO: need libigl for osx-arm64
	"-DPLUGIN_STANDARD_QMPLANE=ON",
	"-DPLUGIN_STANDARD_QMESH_BOOLEAN=OFF", 	#TODO: need libigl for osx-arm64
	#"-DLIBIGL_INCLUDE_DIR:PATH=$HOME/projets/CloudComPy/libigl/libigl/include",
	#"-DLIBIGL_RELEASE_LIBRARY_FILE:FILEPATH=$HOME/projets/CloudComPy/libigl/install/lib/libigl.a",
	"-DPLUGIN_STANDARD_QPCL=ON",
	"-DPLUGIN_STANDARD_QPCV=ON",
	"-DPLUGIN_STANDARD_QPOISSON_RECON=ON",
	"-DPLUGIN_STANDARD_QRANSAC_SD=ON",
	"-DPLUGIN_STANDARD_QSRA=ON",
	"-DPLUGIN_STANDARD_QTREEISO=OFF", 		#TODO: improve compatibility.
	"-DPLUGIN_STANDARD_QVOXFALL=ON",
	#--IO PLUGINS--
	"-DPLUGIN_IO_QADDITIONAL=ON",
	"-DPLUGIN_IO_QCORE=ON",
	"-DPLUGIN_IO_QCSV_MATRIX=ON",
	"-DPLUGIN_IO_QDRACO=ON",
	"-DDRACO_INCLUDE_DIR=$CONDA_PREFIX/include",
	"-DDRACO_LIB_DIR=$CONDA_PREFIX/lib",
	"-DDRACO_LIBRARIES=$CONDA_PREFIX/lib/libdraco.a",
	"-DPLUGIN_IO_QE57=ON",
	"-DE57_RELEASE_LTO=OFF", # TODO: Needed else it won't find the AR/Ranlib binary
	"-DPLUGIN_IO_QFBX=ON", 					# Possible, but it needs a proprietary SDK
	"-DFBX_SDK_INCLUDE_DIR:PATH=/Applications/Autodesk/FBX SDK/2020.2.1/include",
	"-DFBX_SDK_LIBRARY_DIR:PATH=/Applications/Autodesk/FBX SDK/2020.2.1/lib/clang/release",
	"-DFBX_SDK_LIBRARY_FILE:FILEPATH=/Applications/Autodesk/FBX SDK/2020.2.1/lib/clang/release/libfbxsdk.dylib",
	"-DPLUGIN_IO_QLAS=ON",
	"-DPLUGIN_IO_QPHOTOSCAN=ON",
	"-DQUAZIP_INSTALL=OFF",
]

inputs = ["CMakeLists.txt"]
outputs = [".build/CMakeFiles/"]

[feature.build.tasks.build]
cmd = ["cmake", "--build", ".build"]
inputs = ["CMakeLists.txt", "qCC/"]
outputs = [".build/qCC/CloudCompare"]
depends-on = ["configure"]

[feature.build.tasks.install]
cmd = ["cmake", "--install", ".build", "--config", "Release"]
depends-on = ["build"]

#TODO: macos only
# This will embed dependencies and fix rpath accordingly
[feature.build.tasks.bundle]
cmd = [
	"python",
	"scripts/mac/bundle/libBundleCloudCompare.py",
	".build/install",
	"--embed_python",
]
depends-on = ["install"]

# Bundle signature
[feature.build.tasks.sign_bundle]
cmd = [
	"python",
	"scripts/mac/bundle/signatureCloudCompare.py",
	".build/install",
	"--embed_python",
]
depends-on = ["bundle"]

[environments]
build = ["build"]

[pypi-dependencies]
3dfin = { version = "==0.6.0" }
